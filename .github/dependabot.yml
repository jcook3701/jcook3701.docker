---
version: 2
updates:
  # -------------------------------------------------------------------------
  # Python project, development, tooling, and documentation dependencies
  # -------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Los_Angeles"
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # -------------------------------------------------------------------------
  # Jekyll documentation dependencies
  # -------------------------------------------------------------------------
  - package-ecosystem: "bundler"
    directory: "/docs/jekyll"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "America/Los_Angeles"
    groups:
      jekyll-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # -------------------------------------------------------------------------
  # Pre-commit hook revisions
  # -------------------------------------------------------------------------
  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "America/Los_Angeles"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # -------------------------------------------------------------------------
  # GitHub Actions workflow dependencies
  # -------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:45"
      timezone: "America/Los_Angeles"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
