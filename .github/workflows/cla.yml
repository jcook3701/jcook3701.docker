---
name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [
      opened,
      closed,
      reopened,
      synchronize
    ]

# explicitly configure permissions, in case your GITHUB_TOKEN
# workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: write # this can be 'read' if the signatures are in remote repository
  pull-requests: write
  statuses: write

concurrency:
  group: "cla-signatures"
  cancel-in-progress: false

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "CLA Assistant"
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
          (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        # Pin privileged pull_request_target actions to a full commit SHA.
        uses: contributor-license/cla-action@e764f53690399abf600e2932de7ffd607ddb108c # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "cla/v1/signatures.json"
          path-to-document: >-
            https://github.com/jcook3701/jcook3701.docker/blob/main/docs/jekyll/_manual/developer-resources/cla.md
          # branch should not be protected
          branch: "main"
          allowlist: "jcook3701,github-actions[bot],dependabot[bot]"

          # If the below optional inputs are not given, then default values will be taken:
          create-file-commit-message: "chore(CLA): Creating file for storing CLA Signatures."
          signed-commit-message: "chore(CLA): $contributorName has signed the CLA."
          # custom-notsigned-prcomment: "pull request comment with Introductory message to ask new contributors to sign"
          # custom-pr-sign-comment: "The signature to be committed in order to sign the CLA"
          # custom-allsigned-prcomment: "**CLA Assistant Lite bot** All Contributors have signed the CLA."
          lock-pullrequest-aftermerge: true
          use-dco-flag: false # If you are using DCO instead of CLA
