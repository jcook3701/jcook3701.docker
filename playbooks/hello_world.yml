---
- name: Manage hello-world Docker image on localhost
  hosts: localhost
  gather_facts: true
  become: true
  vars:
    state: present
  tasks:
    - name: Install hello-world Docker Image
      ansible.builtin.include_role:
        name: jcook3701.docker.hello_world
      vars:
        hello_world_state: "{{ state | default('present') }}"
