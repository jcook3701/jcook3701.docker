---
# ---------------------------------------------------------------------------
# Runtime Orchestration Engine and Service State
# ---------------------------------------------------------------------------
desktop_commander_container_engine: "docker"
desktop_commander_state: "present"
desktop_commander_debug_mode: false

# ---------------------------------------------------------------------------
# Pinned Runtime Image and Remote Agent
# ---------------------------------------------------------------------------
desktop_commander_image: "docker.io/library/node:24-bookworm-slim"
desktop_commander_package_version: "0.3.4"
desktop_commander_container_name: "desktop-commander"
desktop_commander_pull_policy: "missing"
desktop_commander_pull_images: false
desktop_commander_restart_policy: "unless-stopped"

# ---------------------------------------------------------------------------
# Development Environment Configuration
# ---------------------------------------------------------------------------
desktop_commander_build_development_image: false
desktop_commander_development_image: "desktop-commander-development:local"

# ---------------------------------------------------------------------------
# Git Configuration
# ---------------------------------------------------------------------------
desktop_commander_manage_git: false
desktop_commander_git_user_name: ""
desktop_commander_git_user_email: ""
desktop_commander_git_default_branch: "main"

# ---------------------------------------------------------------------------
# GitHub CLI Configuration
# ---------------------------------------------------------------------------
desktop_commander_manage_gh: false
desktop_commander_gh_username: ""
desktop_commander_gh_token: ""

# ---------------------------------------------------------------------------
# Fixed Host Filesystem Security Boundary
# ---------------------------------------------------------------------------
# Installation fails closed if these paths or this account are changed.
# Only the home directory below is bind-mounted into the container.
desktop_commander_base_dir: "/opt/desktop_commander"
desktop_commander_system_user: "chat-gpt"
desktop_commander_host_home: "/home/chat-gpt"

# ---------------------------------------------------------------------------
# Optional Shared Docker Networking
# ---------------------------------------------------------------------------
desktop_commander_shared_network: ""

# ---------------------------------------------------------------------------
# Container Resource Controls
# ---------------------------------------------------------------------------
desktop_commander_tmpfs_size: "256m"
desktop_commander_memory_limit: "1g"
desktop_commander_pids_limit: 128
