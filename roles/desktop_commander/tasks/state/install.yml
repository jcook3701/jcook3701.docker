---
- name: "Execute Desktop Commander configuration tasks"
  ansible.builtin.include_tasks: "configure/main.yml"

- name: "Deploy isolated Desktop Commander with shared container engine"
  ansible.builtin.import_role:
    name: "jcook3701.utils.container_engine"
  vars:
    container_engine_project_src: "{{ desktop_commander_directory.base }}"
    container_engine_platform_type: "{{ desktop_commander_container_engine }}"
    container_engine_desired_state: "present"
    container_engine_trigger_condition: true
    container_engine_pull_images: >-
      {{ (desktop_commander_pull_images | bool)
         and not (desktop_commander_build_development_image | bool) }}
  become: true
