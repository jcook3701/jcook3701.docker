---
- name: "Stop Desktop Commander without deleting home or cached authorization"
  ansible.builtin.include_tasks: "uninstall.yml"

- name: "Remove only the root-owned Desktop Commander deployment directory"
  ansible.builtin.file:
    path: "{{ desktop_commander_directory.base }}"
    state: "absent"
  become: true
