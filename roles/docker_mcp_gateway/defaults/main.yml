---
# ---------------------------------------------------------------------------
# Runtime Orchestration Engine and Service State
# ---------------------------------------------------------------------------
docker_mcp_gateway_container_engine: "docker"
docker_mcp_gateway_state: "present"
docker_mcp_gateway_teardown_remove_data: false
docker_mcp_gateway_teardown_remove_images: false

# ---------------------------------------------------------------------------
# Container Image and Lifecycle
# ---------------------------------------------------------------------------
docker_mcp_gateway_image: "docker/mcp-gateway@sha256:f5a679a05fc39022a046167bef92aeeb01bcd59485ad27843ae5227db7950688"
docker_mcp_gateway_container_name: "docker-mcp-gateway"
docker_mcp_gateway_pull_policy: "missing"
docker_mcp_gateway_pull_images: false
docker_mcp_gateway_restart_policy: "unless-stopped"

# ---------------------------------------------------------------------------
# Deployment Paths and Network Publication
# ---------------------------------------------------------------------------
docker_mcp_gateway_base_dir: "/opt/docker-mcp-gateway"
docker_mcp_gateway_bind_ip: "127.0.0.1"
docker_mcp_gateway_external_port: 8811
docker_mcp_gateway_internal_port: 8811
docker_mcp_gateway_shared_network: ""

# ---------------------------------------------------------------------------
# Docker MCP Gateway Configuration
# ---------------------------------------------------------------------------
docker_mcp_gateway_transport: "streaming"
docker_mcp_gateway_servers: ["duckduckgo"]
docker_mcp_gateway_auth_token: ""
docker_mcp_gateway_enable_freellmapi_relay: false
docker_mcp_gateway_freellmapi_mcp_url: "http://freellmapi:3001/mcp"
docker_mcp_gateway_freellmapi_api_key: ""
docker_mcp_gateway_enable_longmemory_relay: false
docker_mcp_gateway_longmemory_mcp_url: "http://longmemory:7331/mcp"
docker_mcp_gateway_longmemory_api_key: ""
