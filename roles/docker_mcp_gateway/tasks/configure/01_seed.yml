---
- name: Validate the Docker MCP Gateway server selection
  ansible.builtin.assert:
    that:
      - docker_mcp_gateway_servers | length > 0 or docker_mcp_gateway_enable_freellmapi_relay | bool
      - >-
        "freellmapi-relay" not in docker_mcp_gateway_servers
    fail_msg: "Enable catalog servers or the FreeLLMAPI relay using their respective options."

- name: Validate the FreeLLMAPI relay configuration
  ansible.builtin.assert:
    that:
      - docker_mcp_gateway_shared_network | length > 0
      - docker_mcp_gateway_directory.base is match("^/[A-Za-z0-9_./-]+$")
      - docker_mcp_gateway_freellmapi_mcp_url is match("^https?://[^/?#@]+/mcp$")
      - docker_mcp_gateway_freellmapi_api_key is match("^freellmapi-[0-9a-f]{48}$")
    fail_msg: >-
      Set a shared Docker network, the FreeLLMAPI /mcp endpoint, and its Vault-managed unified key.
  when: docker_mcp_gateway_enable_freellmapi_relay | bool
  no_log: true

- name: Create the private Docker MCP Gateway deployment directory
  ansible.builtin.file:
    path: "{{ docker_mcp_gateway_directory.base }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0750"
  become: true

- name: Seed the persistent Docker MCP Gateway token
  ansible.builtin.copy:
    content: >-
      MCP_GATEWAY_AUTH_TOKEN={{ lookup('ansible.builtin.password', '/dev/null length=64 chars=hexdigits') }}
    dest: "{{ docker_mcp_gateway_file.secrets }}"
    owner: "root"
    group: "root"
    mode: "0600"
    force: false
  become: true
  no_log: true

- name: Deploy the FreeLLMAPI relay and its catalog
  when: docker_mcp_gateway_enable_freellmapi_relay | bool
  become: true
  block:
    - name: Install the FreeLLMAPI relay script
      ansible.builtin.copy:
        src: "freellmapi_relay.py"
        dest: "{{ docker_mcp_gateway_file.relay_script }}"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Render the FreeLLMAPI relay catalog
      ansible.builtin.template:
        src: "freellmapi-relay.yaml.j2"
        dest: "{{ docker_mcp_gateway_file.relay_catalog }}"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Write the FreeLLMAPI relay credential file
      ansible.builtin.copy:
        content: "freellmapi-relay.api_key={{ docker_mcp_gateway_freellmapi_api_key }}\n"
        dest: "{{ docker_mcp_gateway_file.relay_secrets }}"
        owner: "root"
        group: "root"
        mode: "0600"
      no_log: true

- name: Render the Docker MCP Gateway Compose file
  ansible.builtin.template:
    src: "compose.yml.j2"
    dest: "{{ docker_mcp_gateway_file.compose }}"
    owner: "root"
    group: "root"
    mode: "0600"
  become: true
  no_log: true
