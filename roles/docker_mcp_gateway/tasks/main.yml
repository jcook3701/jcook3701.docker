---
- name: Deploy Docker MCP Gateway
  ansible.builtin.include_tasks: "state/install.yml"
  when: docker_mcp_gateway_state == "present"

- name: Remove the Docker MCP Gateway stack
  ansible.builtin.include_tasks: "state/uninstall.yml"
  when: docker_mcp_gateway_state == "absent"

- name: Tear down the Docker MCP Gateway deployment
  ansible.builtin.include_tasks: "state/teardown.yml"
  when: docker_mcp_gateway_state == "teardown"
