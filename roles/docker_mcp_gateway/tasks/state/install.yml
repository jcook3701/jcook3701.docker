---
- name: Configure the Docker MCP Gateway deployment
  ansible.builtin.include_tasks: "configure/01_seed.yml"

- name: Deploy Docker MCP Gateway with the shared container engine
  ansible.builtin.import_role:
    name: "jcook3701.utils.container_engine"
  vars:
    container_engine_project_src: "{{ docker_mcp_gateway_directory.base }}"
    container_engine_platform_type: "{{ docker_mcp_gateway_container_engine }}"
    container_engine_desired_state: "present"
    container_engine_trigger_condition: true
    container_engine_pull_images: "{{ docker_mcp_gateway_pull_images }}"
  become: true
