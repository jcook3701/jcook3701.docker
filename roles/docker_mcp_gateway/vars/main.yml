---
# ---------------------------------------------------------------------------
# Infrastructure Directory Structure
# ---------------------------------------------------------------------------
docker_mcp_gateway_directory:
  base: "{{ docker_mcp_gateway_base_dir | default('/opt/docker-mcp-gateway') }}"

# ---------------------------------------------------------------------------
# Infrastructure File Locations
# ---------------------------------------------------------------------------
docker_mcp_gateway_file:
  compose: "{{ (docker_mcp_gateway_base_dir | default('/opt/docker-mcp-gateway')) ~ '/compose.yml' }}"
  secrets: "{{ (docker_mcp_gateway_base_dir | default('/opt/docker-mcp-gateway')) ~ '/.env' }}"
  relay_script: "{{ (docker_mcp_gateway_base_dir | default('/opt/docker-mcp-gateway')) ~ '/freellmapi_relay.py' }}"
  relay_catalog: "{{ (docker_mcp_gateway_base_dir | default('/opt/docker-mcp-gateway')) ~ '/freellmapi-relay.yaml' }}"
  longmemory_relay_catalog: >-
    {{ (docker_mcp_gateway_base_dir | default('/opt/docker-mcp-gateway')) ~ '/longmemory-relay.yaml' }}
  relay_secrets: "{{ (docker_mcp_gateway_base_dir | default('/opt/docker-mcp-gateway')) ~ '/relay.env' }}"

docker_mcp_gateway_longmemory_tools:
  - "longmemory_project_context"
  - "longmemory_recall"
  - "longmemory_ingest"
  - "longmemory_remember_decision"
  - "longmemory_update_task_state"
  - "longmemory_explain"
  - "longmemory_report_conflicts"
  - "longmemory_sync_connector"
  - "longmemory_match_skills"
  - "longmemory_manage_skill"
  - "longmemory_code_graph"
  - "longmemory_asset_catalog"
  - "longmemory_manage_asset"
