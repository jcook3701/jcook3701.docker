---
# ---------------------------------------------------------------------------
# Runtime Orchestration Engine and Service State
# ---------------------------------------------------------------------------
frigate_nvr_container_engine: "docker"
frigate_nvr_state: "present"
frigate_nvr_debug_mode: false
frigate_nvr_teardown_remove_data: false
frigate_nvr_teardown_remove_images: false

# ---------------------------------------------------------------------------
# Container Image and Lifecycle
# ---------------------------------------------------------------------------
frigate_nvr_image: "ghcr.io/blakeblackshear/frigate"
frigate_nvr_version: "stable"
frigate_nvr_container_name: "frigate"
frigate_nvr_pull_policy: "missing"
frigate_nvr_pull_images: false
frigate_nvr_restart_policy: "unless-stopped"

# ---------------------------------------------------------------------------
# Host Paths and Persistent Storage
# ---------------------------------------------------------------------------
frigate_nvr_base_dir: "/opt/frigate_nvr"
frigate_nvr_config_dir: "{{ frigate_nvr_base_dir + '/config' }}"
frigate_nvr_logs_dir: "{{ frigate_nvr_base_dir + '/logs' }}"
frigate_nvr_storage_dir: "{{ frigate_nvr_base_dir + '/storage' }}"

# Ansible owns and overwrites config.yml by default. Set this to "frigate" to
# seed the file once, mount it read-write, and make the Frigate UI authoritative.
frigate_nvr_config_owner: "ansible"

# ---------------------------------------------------------------------------
# Network Publication
# ---------------------------------------------------------------------------
frigate_nvr_bind_ip: "0.0.0.0"
frigate_nvr_web_port: 8971
frigate_nvr_rtsp_port: 8554
frigate_nvr_webrtc_port: 8555
frigate_nvr_webrtc_udp_port: 8555

# Port 5000 bypasses Frigate authentication. Keep it disabled unless a trusted
# local integration requires it; the default bind remains loopback-only.
frigate_nvr_publish_unauthenticated_port: false
frigate_nvr_unauthenticated_bind_ip: "127.0.0.1"
frigate_nvr_unauthenticated_port: 5000

# ---------------------------------------------------------------------------
# Hardware, Cache, and Runtime Settings
# ---------------------------------------------------------------------------
frigate_nvr_privileged: false
frigate_nvr_shm_size: "512mb"
frigate_nvr_tmpfs_size: 1000000000
frigate_nvr_stop_grace_period: "30s"
frigate_nvr_timezone: "UTC"
frigate_nvr_devices: []
  # Examples:
  # - "/dev/bus/usb:/dev/bus/usb"                    # USB Coral TPU
  # - "/dev/dri/renderD128:/dev/dri/renderD128"      # Intel VAAPI

# ---------------------------------------------------------------------------
# Frigate Configuration
# ---------------------------------------------------------------------------
frigate_nvr_mqtt_enabled: false
frigate_nvr_mqtt_host: "localhost"
frigate_nvr_mqtt_user: ""
frigate_nvr_mqtt_password: ""

# An empty mapping uses Frigate's default CPU detector. Add a detector only
# when its corresponding hardware is also present in frigate_nvr_devices.
frigate_nvr_detectors: {}

frigate_nvr_record:
  enabled: true
  continuous:
    days: 7
  alerts:
    retain:
      days: 30
      mode: "motion"
  detections:
    retain:
      days: 30
      mode: "motion"

frigate_nvr_snapshots:
  enabled: true
  retain:
    default: 14

# Additional top-level Frigate configuration. The role-owned mqtt, database,
# detectors, record, snapshots, and cameras keys cannot be overridden here.
frigate_nvr_extra_config: {}

frigate_nvr_cameras: []
  # Example:
  # - name: "front_door"
  #   enabled: true
  #   detect_enabled: true
  #   width: 1920
  #   height: 1080
  #   fps: 5
  #   inputs:
  #     - path: "rtsp://127.0.0.1:554/stream"
  #       roles:
  #         - "detect"
  #         - "record"
  #   zones:
  #     driveway:
  #       coordinates: "0,473,439,461,902,481,100,200"
  #   extra_config: {}
