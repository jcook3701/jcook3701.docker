---
galaxy_info:
  author: "Jared W. Cook"
  description: "Deploy and manage the Frigate network video recorder in Docker."
  company: "Cook's Code, Inc."
  license: "AGPL-3.0-or-later"
  min_ansible_version: ">=2.10"
  role_name: "frigate_nvr"

  platforms:
    - name: "EL"
      versions:
        - "8"
        - "9"
    - name: "Debian"
      versions:
        - "all"
    - name: "Ubuntu"
      versions:
        - "all"

  galaxy_tags:
    - "docker"
    - "frigate"
    - "nvr"
    - "security"
    - "video"

dependencies:
  - role: "jcook3701.pkgs.docker_ce"

collections:
  - "jcook3701.utils"
  - "community.docker"
  - "containers.podman"
