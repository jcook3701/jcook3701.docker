---
- name: Create persistent storage base subdirectories
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ frigate_nvr_directory.base | default('/opt/frigate_nvr') }}"
    - "{{ frigate_nvr_directory.upload | default('/opt/frigate_nvr/upload') }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"
  become: true

- name: Render dynamic application configurations from template
  ansible.builtin.template:
    src: "config.yml.j2"
    dest: "{{ frigate_nvr_file.config | default('/opt/frigate_nvr/config/.yml') }}"
    owner: "1000"
    group: "1000"
    mode: "0644"
  become: true

- name: Deploy the Docker Compose template file
  ansible.builtin.template:
    src: "compose.yml.j2"
    dest: "{{ timesketch_file.compose | default('/opt/timesketch/compose.yml') }}"
    owner: root
    group: root
    mode: "0644"
  become: true
