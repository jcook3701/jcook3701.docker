---
- name: Debug Teardown of Frigate NVR application
  ansible.builtin.debug:
    msg: "frigate_nvr_directory.base: {{ frigate_nvr_directory.base }}"
  when: frigate_nvr_debug_mode | default(false) | bool

- name: Include standard termination routine definitions
  ansible.builtin.include_tasks: uninstall.yml

- name: Purge remaining historical data layers and configurations
  ansible.builtin.file:
    path: "{{ frigate_nvr_directory.base | default('/opt/frigate_nvr') }}"
    state: absent
  become: true
