---
- name:  Manage Guacamole directories state
  ansible.builtin.file:
    path: "{{ folder.value }}"
    state: "{{ (guacamole_state == 'present') | ternary('directory', 'absent') }}"
    mode: "0755"
  loop: "{{ guacamole_directory | dict2items }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.value }} ({{ guacamole_state }})"
