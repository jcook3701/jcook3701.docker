---
- name: Create root-owned Headroom deployment directory
  ansible.builtin.file:
    path: "{{ headroom_directory.base }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0750"
  become: true

- name: Create private persistent Headroom data directory
  ansible.builtin.file:
    path: "{{ headroom_directory.data }}"
    state: "directory"
    owner: "{{ headroom_container_uid }}"
    group: "{{ headroom_container_gid }}"
    mode: "0700"
  become: true

- name: Deploy Headroom Compose configuration
  ansible.builtin.template:
    src: "compose.yml.j2"
    dest: "{{ headroom_file.compose }}"
    owner: "root"
    group: "root"
    mode: "0600"
  become: true
  no_log: true
