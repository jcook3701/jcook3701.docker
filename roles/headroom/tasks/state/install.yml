---
- name: Execute Headroom configuration tasks
  ansible.builtin.include_tasks: "configure/main.yml"

- name: Deploy Headroom with the shared container engine
  ansible.builtin.import_role:
    name: "jcook3701.utils.container_engine"
  vars:
    container_engine_project_src: "{{ headroom_directory.base }}"
    container_engine_platform_type: "{{ headroom_container_engine }}"
    container_engine_desired_state: "present"
    container_engine_trigger_condition: true
    container_engine_pull_images: "{{ headroom_pull_images }}"
  become: true
