---
- name: Create Headscale deployment and configuration directories
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ headscale_directory.base | default('/opt/headscale') }}"
    - "{{ headscale_directory.config | default('/opt/headscale/config') }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"
  become: true

- name: Create restricted Headscale persistent data directories
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ headscale_directory.lib | default('/opt/headscale/lib') }}"
    - "{{ headscale_directory.backups | default('/opt/headscale/backups') }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"
  become: true

- name: Create Headplane deployment directories
  ansible.builtin.file:
    path: "{{ directory.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ directory.mode }}"
  loop:
    - path: "{{ headscale_directory.headplane_config | default('/opt/headscale/headplane/config') }}"
      mode: "0700"
    - path: "{{ headscale_directory.headplane_data | default('/opt/headscale/headplane/data') }}"
      mode: "0700"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory.path }}"
  when: headscale_manage_headplane | default(false) | bool
  become: true

- name: Create persistent Headplane session secret
  ansible.builtin.copy:
    content: "{{ lookup('community.general.random_string', length=32, special=false) }}"
    dest: "{{ headscale_file.headplane_cookie_secret | default('/opt/headscale/headplane/config/cookie_secret') }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  when: headscale_manage_headplane | default(false) | bool
  become: true
  no_log: true

- name: Deploy Headplane web dashboard configuration
  ansible.builtin.template:
    src: headplane-config.yml.j2
    dest: "{{ headscale_file.headplane_config | default('/opt/headscale/headplane/config/config.yaml') }}"
    owner: root
    group: root
    mode: "0600"
  when: headscale_manage_headplane | default(false) | bool
  become: true

- name: Deploy Headscale application configuration
  ansible.builtin.template:
    src: headscale-config.yml.j2
    dest: "{{ headscale_file.config | default('/opt/headscale/config/config.yaml') }}"
    owner: root
    group: root
    mode: "0600"
    force: >-
      {{ not ((headscale_manage_headplane | default(false) | bool)
        and (headscale_headplane_docker_enabled | default(false) | bool)) }}
  become: true

- name: Inspect existing Headplane API key
  ansible.builtin.stat:
    path: "{{ headscale_file.headplane_api_key | default('/opt/headscale/headplane/config/api_key') }}"
  register: headscale_headplane_api_key_status
  when: headscale_manage_headplane | default(false) | bool
  become: true

- name: Deploy Headscale Compose configuration
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ headscale_file.compose | default('/opt/headscale/compose.yml') }}"
    owner: root
    group: root
    mode: "0644"
  become: true
