---
- name: Ensure Headscale is installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: headscale_state | default('present') == 'present'

- name: Ensure Headscale is uninstalled from system
  ansible.builtin.include_tasks: state/uninstall.yml
  when: headscale_state | default('present') == 'absent'

- name: Ensure Headscale is purged from system
  ansible.builtin.include_tasks: state/teardown.yml
  when: headscale_state | default('present') == 'teardown'
