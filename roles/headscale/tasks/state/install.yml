---
- name: Execute Headscale configuration tasks
  ansible.builtin.include_tasks: "configure/main.yml"

- name: Inspect disabled Headplane container
  community.docker.docker_container_info:
    name: "{{ headscale_headplane_container_name | default('headplane') }}"
  register: headscale_headplane_existing
  when: not (headscale_manage_headplane | default(false) | bool)
  become: true

- name: Remove disabled role-managed Headplane container
  community.docker.docker_container:
    name: "{{ headscale_headplane_container_name | default('headplane') }}"
    state: "absent"
  when:
    - not (headscale_manage_headplane | default(false) | bool)
    - headscale_headplane_existing.exists | default(false)
    - >-
      (headscale_headplane_existing.container.Config.Labels | default({})).get(
      'com.jcook3701.docker.role', '') == 'headscale'
  become: true

- name: Trigger Headscale container engine stack deployment
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    container_engine_project_src: "{{ headscale_directory.base | default('/opt/headscale') }}"
    container_engine_platform_type: "{{ headscale_container_engine | default('docker') }}"
    container_engine_desired_state: present
    container_engine_trigger_condition: true

- name: Provision Headplane API key and complete dashboard deployment
  ansible.builtin.include_tasks: "post_processing/01_headplane_api_key.yml"
  when: headscale_manage_headplane | default(false) | bool

- name: Provision Headscale client pre-authentication key
  ansible.builtin.include_tasks: "post_processing/02_client_preauth_key.yml"
  when: headscale_manage_client_preauth_key | default(false) | bool
