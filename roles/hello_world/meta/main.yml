---
galaxy_info:
  author: Jared Cook
  description: "This role executes the Docker hello-world container,
    captures output, and handles image teardown."
  company: "Cook's Code, Inc."
  license: "AGPL-3.0-or-later"
  min_ansible_version: ">=2.10"
  role_name: hello_world

  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all

  galaxy_tags:
    - packages
    - docker
    - desktop
    - apps

dependencies:
  - role: jcook3701.pkgs.docker_ce

collections:
  - community.docker
  - containers.podman
