---
- name: Create root-owned LongMemory deployment directory
  ansible.builtin.file:
    path: "{{ longmemory_directory.base }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0750"
  become: true

- name: Inspect persistent LongMemory secrets file
  ansible.builtin.stat:
    path: "{{ longmemory_file.secrets }}"
  register: longmemory_secrets_stat
  become: true

- name: Read existing persistent LongMemory API key
  ansible.builtin.slurp:
    src: "{{ longmemory_file.secrets }}"
  register: longmemory_existing_secrets
  become: true
  no_log: true
  when: longmemory_secrets_stat.stat.exists

- name: Validate existing persistent LongMemory API key
  ansible.builtin.assert:
    that:
      - >-
        (longmemory_existing_secrets.content | b64decode)
        is search("(?m)^LONGMEMORY_API_KEY=[0-9a-fA-F]{64}$")
      - >-
        longmemory_api_key | length == 0
        or ("LONGMEMORY_API_KEY=" ~ longmemory_api_key)
        in (longmemory_existing_secrets.content | b64decode).splitlines()
    fail_msg: "The persistent API key is invalid or differs from the supplied Vault key."
  when: longmemory_secrets_stat.stat.exists
  no_log: true

- name: Initialize persistent LongMemory API key
  ansible.builtin.copy:
    content: >-
      LONGMEMORY_API_KEY={{
        longmemory_api_key
        if longmemory_api_key | length > 0
        else lookup('ansible.builtin.password', '/dev/null length=64 chars=hexdigits')
      }}
    dest: "{{ longmemory_file.secrets }}"
    owner: "root"
    group: "root"
    mode: "0600"
    force: false
  become: true
  no_log: true

- name: Enforce private LongMemory secrets file permissions
  ansible.builtin.file:
    path: "{{ longmemory_file.secrets }}"
    state: "file"
    owner: "root"
    group: "root"
    mode: "0600"
  become: true
  no_log: true

- name: Create persistent LongMemory Docker volume
  community.docker.docker_volume:
    name: "longmemory_data"
    state: "present"
  become: true

- name: Retrieve LongMemory dashboard source
  ansible.builtin.git:
    repo: "{{ longmemory_repo_url }}"
    dest: "{{ longmemory_directory.source }}"
    version: "{{ longmemory_repo_version }}"
    update: true
    force: false
  become: true
  when: longmemory_enable_dashboard | bool

- name: Deploy LongMemory Compose configuration
  ansible.builtin.template:
    src: "compose.yml.j2"
    dest: "{{ longmemory_file.compose }}"
    owner: "root"
    group: "root"
    mode: "0600"
  become: true
  no_log: true
