---
- name: Inspect LongMemory Compose configuration
  ansible.builtin.stat:
    path: "{{ longmemory_file.compose }}"
  register: longmemory_compose_stat
  become: true

- name: Stop LongMemory stack without deleting persistent state
  ansible.builtin.import_role:
    name: "jcook3701.utils.container_engine"
  vars:
    container_engine_project_src: "{{ longmemory_directory.base }}"
    container_engine_platform_type: "{{ longmemory_container_engine }}"
    container_engine_desired_state: "absent"
    container_engine_trigger_condition: true
  become: true
  when: longmemory_compose_stat.stat.exists
