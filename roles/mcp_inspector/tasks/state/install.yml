---
- name: Configure the MCP Inspector deployment
  ansible.builtin.include_tasks: "configure/01_seed.yml"

- name: Deploy MCP Inspector with the shared container engine
  ansible.builtin.import_role:
    name: "jcook3701.utils.container_engine"
  vars:
    container_engine_project_src: "{{ mcp_inspector_directory.base }}"
    container_engine_platform_type: "{{ mcp_inspector_container_engine }}"
    container_engine_desired_state: "present"
    container_engine_trigger_condition: true
    container_engine_pull_images: "{{ mcp_inspector_pull_images }}"
  become: true
