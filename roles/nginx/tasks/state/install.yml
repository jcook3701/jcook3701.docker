---
- name: Execute Nginx configuration tasks
  ansible.builtin.include_tasks: "configure/main.yml"

- name: Trigger Nginx container engine stack deployment
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    container_engine_project_src: "{{ nginx_directory.base | default('/opt/nginx') }}"
    container_engine_platform_type: "{{ nginx_container_engine | default('docker') }}"
    container_engine_desired_state: "present"
    container_engine_trigger_condition: true
    container_engine_pull_images: "{{ nginx_pull_images | default(false) | bool }}"
