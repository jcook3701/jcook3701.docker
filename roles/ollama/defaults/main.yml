---
# ---------------------------------------------------------------------------
# Runtime Orchestration Engine and Service State
# ---------------------------------------------------------------------------
ollama_container_engine: "docker"
ollama_state: present
ollama_debug_mode: false
ollama_teardown_remove_data: false
ollama_teardown_remove_images: false

# Optional Service Management
ollama_manage_web_ui: true
ollama_manage_n8n: true
ollama_manage_mcp: true
ollama_manage_mcp_inspector: true
ollama_manage_searxng: true

# ---------------------------------------------------------------------------
# Service Container Images and Engine Versions
# ---------------------------------------------------------------------------
ollama_backend_image: "docker.io/ollama/ollama:latest"
ollama_webui_image: "ghcr.io/open-webui/open-webui:main"
ollama_n8n_image: "docker.n8n.io/n8nio/n8n:latest"
ollama_mcp_gateway_image: "docker/mcp-gateway:latest"
ollama_mcp_inspector_image: "ghcr.io/modelcontextprotocol/inspector:latest"
ollama_searxng_image: "docker.io/searxng/searxng:latest"
ollama_searxng_valkey_image: "docker.io/valkey/valkey:9-alpine"
ollama_pull_policy: "missing"
ollama_pull_images: false
ollama_restart_policy: "unless-stopped"

# ---------------------------------------------------------------------------
# Container Names
# ---------------------------------------------------------------------------
ollama_backend_container_name: "ollama"
ollama_webui_container_name: "ollama-webui"
ollama_n8n_container_name: "ollama-n8n"
ollama_mcp_gateway_container_name: "ollama-mcp-gateway"
ollama_mcp_inspector_container_name: "ollama-mcp-inspector"
ollama_searxng_container_name: "searxng"
ollama_searxng_valkey_container_name: "searxng-valkey"

# ---------------------------------------------------------------------------
# Infrastructure Storage and Path Routing
# ---------------------------------------------------------------------------
ollama_base_dir: "/opt/ollama"

# ---------------------------------------------------------------------------
# Telly Terminal Configuration
# ---------------------------------------------------------------------------
ollama_backend_tty: true
ollama_backend_keep_alive: "24h"

# ---------------------------------------------------------------------------
# Networking Configuration
# ---------------------------------------------------------------------------
# Preserve LAN access to Ollama and Open WebUI, but bind auxiliary UIs to
# loopback unless explicitly exposed through a reverse proxy or a firewall.
ollama_host_bind_ip: "0.0.0.0"
ollama_backend_bind_ip: "{{ ollama_host_bind_ip }}"
ollama_webui_bind_ip: "{{ ollama_host_bind_ip }}"
ollama_n8n_bind_ip: "127.0.0.1"
ollama_mcp_gateway_bind_ip: "127.0.0.1"
ollama_mcp_inspector_bind_ip: "127.0.0.1"
ollama_searxng_bind_ip: "127.0.0.1"

ollama_external_port: 11434
ollama_webui_external_port: 3000
ollama_n8n_external_port: 5678
ollama_mcp_gateway_external_port: 8811
ollama_mcp_inspector_external_port: 6274
ollama_searxng_external_port: 8081

ollama_internal_bind_ip: "0.0.0.0"
ollama_internal_port: 11434
ollama_webui_internal_port: 8080
ollama_n8n_internal_port: 5678
ollama_mcp_gateway_internal_port: 8811
ollama_mcp_inspector_internal_port: 6274
ollama_mcp_inspector_sandbox_port: 6275
ollama_mcp_inspector_app_origin_port: 6278
ollama_searxng_internal_port: 8080

# ---------------------------------------------------------------------------
# Application Security Credentials
# ---------------------------------------------------------------------------
# Empty values use strong, persistent generated values in /opt/ollama/.env.
# Override with Vault-encrypted inventory variables if preferred.
ollama_webui_url: ""
ollama_webui_no_proxy: "localhost,127.0.0.1,ollama"
ollama_webui_secret_key: ""
ollama_webui_auth: true
ollama_webui_enable_signup: false
ollama_webui_name: "Ollama WebUI"
ollama_webui_environment: "prod"
ollama_backend_internal_url: "http://ollama:11434"

# ---------------------------------------------------------------------------
# n8n Automation Configuration
# ---------------------------------------------------------------------------
ollama_n8n_host: ""
ollama_n8n_protocol: "http"
ollama_n8n_listen_address: "0.0.0.0"
ollama_n8n_secure_cookie: false
ollama_n8n_timezone: "America/Los_Angeles"
ollama_n8n_proxy_hops: 0
# Leave empty to preserve n8n's existing auto-generated, persisted key.
ollama_n8n_encryption_key: ""
ollama_n8n_editor_base_url: ""
ollama_n8n_webhook_url: ""
ollama_n8n_mcp_base_url: ""

# ---------------------------------------------------------------------------
# Docker MCP Gateway Configuration
# ---------------------------------------------------------------------------
ollama_mcp_gateway_transport: "streaming"
ollama_mcp_gateway_servers:
  - "duckduckgo"
# Empty uses a generated persistent token shared in /opt/ollama/.env.
ollama_mcp_gateway_auth_token: ""

# ---------------------------------------------------------------------------
# MCP Inspector Configuration
# ---------------------------------------------------------------------------
# Keep the Inspector UI bound to loopback by default.
# Empty origins use the Inspector's built-in origin policy.
ollama_mcp_inspector_allowed_origins: []

# Optional Vault-provided encryption key for Inspector's secret store.
# Empty generates a persistent key file on first deployment.
ollama_mcp_inspector_secret_key: ""

# ---------------------------------------------------------------------------
# SearXNG Search Configuration
# ---------------------------------------------------------------------------
ollama_searxng_secret_key: ""
ollama_searxng_instance_name: "SearXNG"
ollama_searxng_safe_search: 1
# Enable only when SearXNG is behind a trusted proxy that supplies client IP headers.
ollama_searxng_limiter: false
ollama_searxng_limiter_pass_ips: []
ollama_searxng_image_proxy: true
ollama_searxng_valkey_url: "valkey://searxng-valkey:6379/0"

# ---------------------------------------------------------------------------
# Open WebUI Web Search Integration
# ---------------------------------------------------------------------------
ollama_webui_enable_rag_web_search: true
ollama_webui_rag_web_search_engine: "searxng"
ollama_webui_searxng_query_url: "http://searxng:8080/search"
ollama_webui_searxng_language: "all"

# ---------------------------------------------------------------------------
# Resource and Engine Controls
# ---------------------------------------------------------------------------
ollama_enable_gpu: true
ollama_docker_runtime: "nvidia"
# The special ["all"] value is rendered as count: all for Docker Compose.
ollama_gpu_device_ids: ["all"]
ollama_gpu_device_count: "all"
ollama_gpu_capabilities: ["gpu", "compute", "utility"]
ollama_nvidia_driver_capabilities: "compute,utility"

# ---------------------------------------------------------------------------
# Post-Provisioning Model Preloading
# ---------------------------------------------------------------------------
ollama_manage_models: false
ollama_preload_models:
  - "deepseek-r1:32b"
  - "qwen2.5-coder:32b"
  - "qwen2.5-coder:7b"
  - "llama3.1:8b"
  - "qwen2.5-coder:1.5b-base"
  - "nomic-embed-text:latest"
