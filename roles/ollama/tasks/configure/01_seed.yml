---
- name: Create persistent storage base subdirectories
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ollama_directory.base | default('/opt/ollama') }}"
    - "{{ ollama_directory.backups | default('/opt/ollama/backups') }}"
    - "{{ ollama_directory.ollama | default('/opt/ollama/ollama') }}"
    - "{{ ollama_directory.open_webui | default('/opt/ollama/open-webui') }}"
    - "{{ ollama_directory.n8n | default('/opt/ollama/n8n') }}"
    - "{{ ollama_directory.searxng_config | default('/opt/ollama/searxng/config') }}"
    - "{{ ollama_directory.searxng_cache | default('/opt/ollama/searxng/cache') }}"
    - "{{ ollama_directory.searxng_valkey | default('/opt/ollama/searxng/valkey') }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"
  become: true

- name: Deploy Ollama Compose configuration
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ ollama_file.compose }}"
    owner: root
    group: root
    mode: "0644"
  become: true
