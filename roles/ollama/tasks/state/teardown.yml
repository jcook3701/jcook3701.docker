---
- name: Debug Teardown of Ollama application
  ansible.builtin.debug:
    msg: "ollama_directory.base: {{ ollama_directory.base | default('/opt/ollama') }}"
  when: ollama_debug_mode | default(false) | bool

- name: Include standard termination routine definitions
  ansible.builtin.include_tasks: uninstall.yml

- name: Purge remaining historical data layers and configurations
  ansible.builtin.file:
    path: "{{ ollama_directory.base | default('/opt/ollama') }}"
    state: absent
  become: true
