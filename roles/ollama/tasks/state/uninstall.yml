---
- name: Trigger Ollama container engine stack removal
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    container_engine_project_src: "{{ ollama_directory.base | default('/opt/ollama') }}"
    container_engine_platform_type: "{{ ollama_container_engine | default('docker') }}"
    container_engine_desired_state: teardown
    container_engine_trigger_condition: true
