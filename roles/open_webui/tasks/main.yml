---
- name: Deploy Open WebUI
  ansible.builtin.include_tasks: "state/install.yml"
  when: open_webui_state == "present"

- name: Remove the Open WebUI stack
  ansible.builtin.include_tasks: "state/uninstall.yml"
  when: open_webui_state == "absent"

- name: Tear down the Open WebUI deployment
  ansible.builtin.include_tasks: "state/teardown.yml"
  when: open_webui_state == "teardown"
