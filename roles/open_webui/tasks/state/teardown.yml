---
- name: Validate the Open WebUI data removal path
  ansible.builtin.assert:
    that:
      - open_webui_directory.base is match("^/.+/[^/]+$")
      - >-
        ".." not in open_webui_directory.base.split("/")
      - open_webui_directory.base.split("/") | last == "open-webui"
    fail_msg: "For destructive teardown, the deployment path must end in open-webui."
  when: open_webui_teardown_remove_data | bool

- name: Stop Open WebUI
  ansible.builtin.include_tasks: "uninstall.yml"
  when: not (open_webui_teardown_remove_images | bool)

- name: Stop Open WebUI and remove its Compose images
  ansible.builtin.import_role:
    name: "jcook3701.utils.container_engine"
  vars:
    container_engine_project_src: "{{ open_webui_directory.base }}"
    container_engine_platform_type: "{{ open_webui_container_engine }}"
    container_engine_desired_state: "teardown"
    container_engine_trigger_condition: true
  become: true
  when: open_webui_teardown_remove_images | bool

- name: Remove the Open WebUI Compose file
  ansible.builtin.file:
    path: "{{ open_webui_file.compose }}"
    state: "absent"
  become: true
  when: not (open_webui_teardown_remove_data | bool)

- name: Remove the Open WebUI deployment and data
  ansible.builtin.file:
    path: "{{ open_webui_directory.base }}"
    state: "absent"
  become: true
  when: open_webui_teardown_remove_data | bool
