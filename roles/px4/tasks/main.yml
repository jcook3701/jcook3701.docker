---
- name: Collect running user facts
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    tasks_from: sudo_user_facts.yml
  when: sudo_user is not defined

- name: Load px4 OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Route to uninstall tasks if requested
  ansible.builtin.include_tasks: uninstall.yml
  when: action | default('install') == 'uninstall'

- name: Route to install tasks if requested
  ansible.builtin.include_tasks: install.yml
  when: action | default('install') == 'install'
