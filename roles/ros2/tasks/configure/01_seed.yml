---
- name: Create persistent storage base subdirectories
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ ros2_directory.base | default('/opt/ros2') }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"
  become: true
