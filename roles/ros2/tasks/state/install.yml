---
- name: Execute ROS2 configuration tasks
  ansible.builtin.include_tasks: "configure/main.yml"

- name: Trigger ROS2 container engine stack deployment
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    container_engine_project_src: "{{ ros2_directory.base | default('/opt/ros2') }}"
    container_engine_platform_type: "{{ ros2_container_engine | default('docker') }}"
    container_engine_desired_state: present
    container_engine_trigger_condition: true

- name: Execute ROS2 post-processing configuration tasks
  ansible.builtin.include_tasks: "post_processing/main.yml"
