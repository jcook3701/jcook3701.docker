---
- name: Trigger ROS2 container engine stack removal
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    container_engine_project_src: "{{ ros2_directory.base | default('/opt/ros2') }}"
    container_engine_platform_type: "{{ ros2_container_engine | default('docker') }}"
    container_engine_desired_state: teardown
    container_engine_trigger_condition: true
