---
# ---------------------------------------------------------------------------
# Infrastructure Directory Structure
# ---------------------------------------------------------------------------
ros2_directory:
  base: "{{ ros2_base_dir | default('/opt/ros2') }}"
  workspace: "{{ (ros2_base_dir | default('/opt/ros2')) ~ '/workspace' }}"
  workspace_src: "{{ (ros2_base_dir | default('/opt/ros2')) ~ '/workspace/src' }}"
  ros_home: "{{ (ros2_base_dir | default('/opt/ros2')) ~ '/ros-home' }}"

# ---------------------------------------------------------------------------
# Infrastructure File Locations
# ---------------------------------------------------------------------------
ros2_file:
  compose: "{{ ((ros2_directory.base | default('/opt/ros2')) ~ '/compose.yml') | default('/opt/ros2/compose.yml') }}"
