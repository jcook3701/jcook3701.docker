---
- name: Deploy SearXNG
  ansible.builtin.include_tasks: "state/install.yml"
  when: searxng_state == "present"

- name: Remove the SearXNG stack
  ansible.builtin.include_tasks: "state/uninstall.yml"
  when: searxng_state == "absent"

- name: Tear down the SearXNG deployment
  ansible.builtin.include_tasks: "state/teardown.yml"
  when: searxng_state == "teardown"
