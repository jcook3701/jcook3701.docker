---
- name: Validate the SearXNG data removal path
  ansible.builtin.assert:
    that:
      - searxng_directory.base is match("^/.+/[^/]+$")
      - >-
        ".." not in searxng_directory.base.split("/")
      - searxng_directory.base.split("/") | last == "searxng"
    fail_msg: "For destructive teardown, the deployment path must end in searxng."
  when: searxng_teardown_remove_data | bool

- name: Stop SearXNG
  ansible.builtin.include_tasks: "uninstall.yml"
  when: not (searxng_teardown_remove_images | bool)

- name: Stop SearXNG and remove its Compose images
  ansible.builtin.import_role:
    name: "jcook3701.utils.container_engine"
  vars:
    container_engine_project_src: "{{ searxng_directory.base }}"
    container_engine_platform_type: "{{ searxng_container_engine }}"
    container_engine_desired_state: "teardown"
    container_engine_trigger_condition: true
  become: true
  when: searxng_teardown_remove_images | bool

- name: Remove the SearXNG Compose file
  ansible.builtin.file:
    path: "{{ searxng_file.compose }}"
    state: "absent"
  become: true
  when: not (searxng_teardown_remove_data | bool)

- name: Remove the SearXNG deployment and data
  ansible.builtin.file:
    path: "{{ searxng_directory.base }}"
    state: "absent"
  become: true
  when: searxng_teardown_remove_data | bool
