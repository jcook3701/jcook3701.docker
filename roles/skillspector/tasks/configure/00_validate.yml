---
- name: "Validate that SkillSpector cannot bind unrelated host directories"
  ansible.builtin.assert:
    that:
      - "(skillspector_user | default('chat-gpt')) is match('^[a-z][a-z0-9-]+$')"
      - "(skillspector_group | default('chat-gpt')) is match('^[a-z][a-z0-9-]+$')"
      - "(skillspector_user | default('chat-gpt')) != 'root'"
      - "(skillspector_user | default('chat-gpt')) != 'jcook'"
      - "(skillspector_user_home | default('/home/chat-gpt')) ==
          '/home/' ~ (skillspector_user | default('chat-gpt'))"
      - "(skillspector_workspace_dir | default('/home/chat-gpt/workbench')) ==
          (skillspector_user_home | default('/home/chat-gpt')) ~ '/workbench'"
      - "(skillspector_scan_dir | default('/home/chat-gpt/workbench/skill-scans')) ==
          (skillspector_workspace_dir | default('/home/chat-gpt/workbench')) ~ '/skill-scans'"
      - "(skillspector_reports_dir | default('/home/chat-gpt/workbench/skill-reports')) ==
          (skillspector_workspace_dir | default('/home/chat-gpt/workbench')) ~ '/skill-reports'"
      - "(skillspector_repository | default('https://github.com/NVIDIA/SkillSpector.git')) ==
          'https://github.com/NVIDIA/SkillSpector.git'"
      - "(skillspector_revision | default('e2674da339b0bddc6e565d059c0577c6d9cd25da'))
          is match('^[a-f0-9]{40}$')"
      - "(skillspector_network_mode | default('bridge')) in ['bridge', 'none']"
      - "(skillspector_memory_limit | default('2g')) is match('^[1-9][0-9]*[kKmMgG]$')"
      - "(skillspector_tmpfs_size | default('512m')) is match('^[1-9][0-9]*[kKmMgG]$')"
      - "(skillspector_cpu_limit | default('2.0')) is match('^[1-9][0-9]*(\\.[0-9]+)?$')"
      - "(skillspector_pids_limit | default(256) | int) > 0"
      - "(skillspector_ollama_model | default('qwen2.5-coder:7b')) is match('^[a-zA-Z0-9._:/-]+$')"
      - "not (skillspector_enable_llm | default(false) | bool) or
          (skillspector_network_mode | default('bridge')) == 'bridge'"
      - "not (skillspector_enable_llm | default(false) | bool) or
          (skillspector_ollama_base_url | default('http://host.docker.internal:11434/v1')) ==
          'http://host.docker.internal:11434/v1'"
    fail_msg: "Unsafe or inconsistent scanner identity, source, mount roots, or network settings."

- name: "Resolve the dedicated SkillSpector sandbox user"
  ansible.builtin.getent:
    database: "passwd"
    key: "{{ skillspector_user | default('chat-gpt') }}"

- name: "Resolve the dedicated SkillSpector sandbox group"
  ansible.builtin.getent:
    database: "group"
    key: "{{ skillspector_group | default('chat-gpt') }}"

- name: "Inspect the dedicated sandbox home directory"
  ansible.builtin.stat:
    path: "{{ skillspector_user_home | default('/home/chat-gpt') }}"
    follow: false
  register: skillspector_home_stat

- name: "Verify existing sandbox home directory identity and ownership"
  ansible.builtin.assert:
    that:
      - "ansible_facts.getent_passwd[skillspector_user | default('chat-gpt')][4] ==
          (skillspector_user_home | default('/home/chat-gpt'))"
      - "(ansible_facts.getent_passwd[skillspector_user | default('chat-gpt')][1] | int) > 0"
      - "skillspector_home_stat.stat.exists | default(false)"
      - "skillspector_home_stat.stat.isdir | default(false)"
      - "not (skillspector_home_stat.stat.islnk | default(false))"
      - "(skillspector_home_stat.stat.pw_name | default('')) ==
          (skillspector_user | default('chat-gpt'))"
    fail_msg: "The dedicated home must exist as a real directory owned by the sandbox user."

- name: "Inspect potential deployment and scanner directory links"
  ansible.builtin.stat:
    path: "{{ directory }}"
    follow: false
  loop:
    - "{{ skillspector_directory.base | default(skillspector_base_dir | default('/opt/skillspector')) }}"
    - "{{ skillspector_directory.workspace | default(skillspector_workspace_dir |
            default('/home/chat-gpt/workbench')) }}"
    - "{{ skillspector_directory.scans | default(skillspector_scan_dir |
            default('/home/chat-gpt/workbench/skill-scans')) }}"
    - "{{ skillspector_directory.reports | default(skillspector_reports_dir |
            default('/home/chat-gpt/workbench/skill-reports')) }}"
  loop_control:
    loop_var: directory
    label: "Inspecting directory: {{ directory }}"
  register: skillspector_directory_stats
  become: true

- name: "Reject pre-existing symlinks or non-directory paths"
  ansible.builtin.assert:
    that:
      - "not (directory_stat.stat.islnk | default(false))"
      - "not (directory_stat.stat.exists | default(false)) or
          (directory_stat.stat.isdir | default(false))"
    fail_msg: "A managed directory is not a real directory: {{ directory_stat.item }}"
  loop: "{{ skillspector_directory_stats.results }}"
  loop_control:
    loop_var: directory_stat
    label: "Validating directory: {{ directory_stat.item }}"

- name: "Report the restricted SkillSpector scope"
  ansible.builtin.debug:
    msg:
      - "Source: {{ skillspector_repository | default('https://github.com/NVIDIA/SkillSpector.git') }}
          @ {{ skillspector_revision | default('e2674da339b0bddc6e565d059c0577c6d9cd25da') }}"
      - "Read-only input mount: {{ skillspector_directory.scans |
          default(skillspector_scan_dir | default('/home/chat-gpt/workbench/skill-scans')) }}"
      - "Writable reports mount: {{ skillspector_directory.reports |
          default(skillspector_reports_dir | default('/home/chat-gpt/workbench/skill-reports')) }}"
      - "Network: {{ skillspector_network_mode | default('bridge') }}"
  when: skillspector_debug_mode | default(false) | bool
...
