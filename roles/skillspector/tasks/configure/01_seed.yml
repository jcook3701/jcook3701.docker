---
- name: "Enforce owner-only permissions on the existing sandbox home"
  ansible.builtin.file:
    path: "{{ skillspector_user_home | default('/home/chat-gpt') }}"
    state: "directory"
    mode: "0700"
  become: true

- name: "Create root-owned SkillSpector image build directory"
  ansible.builtin.file:
    path: "{{ skillspector_directory.base | default(skillspector_base_dir | default('/opt/skillspector')) }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  become: true

- name: "Create dedicated sandbox workbench and scanner directories"
  ansible.builtin.file:
    path: "{{ directory }}"
    state: "directory"
    owner: "{{ skillspector_user | default('chat-gpt') }}"
    group: "{{ skillspector_group | default('chat-gpt') }}"
    mode: "0700"
  loop:
    - "{{ skillspector_directory.workspace | default(skillspector_workspace_dir |
            default('/home/chat-gpt/workbench')) }}"
    - "{{ skillspector_directory.scans | default(skillspector_scan_dir |
            default('/home/chat-gpt/workbench/skill-scans')) }}"
    - "{{ skillspector_directory.reports | default(skillspector_reports_dir |
            default('/home/chat-gpt/workbench/skill-reports')) }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"
  become: true
...
