---
- name: Debug Teardown of SkillSpector application
  ansible.builtin.debug:
    msg: "skillspector_directory.base: {{ skillspector_directory.base | default('/opt/skillspector') }}"
  when: skillspector_debug_mode | default(false) | bool

- name: Include standard termination routine definitions
  ansible.builtin.include_tasks: "uninstall.yml"

- name: Purge remaining SkillSpector source and Compose configuration
  ansible.builtin.file:
    path: "{{ skillspector_directory.base | default('/opt/skillspector') }}"
    state: "absent"
  become: true
