---
- name: "Remove the SkillSpector on-demand launcher"
  ansible.builtin.file:
    path: "{{ skillspector_file.wrapper }}"
    state: "absent"
  become: true

- name: "Remove only the role-managed SkillSpector image tag"
  community.docker.docker_image:
    name: "{{ skillspector_image }}"
    tag: "{{ skillspector_version }}"
    state: "absent"
    force_absent: false
  become: true
...
