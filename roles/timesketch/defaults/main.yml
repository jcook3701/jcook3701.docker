---
timesketch_container_engine: "docker"
timesketch_state: present
timesketch_debug_mode: true

timesketch_image: us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:latest
timesketch_opensearch_version: "2.11.0"
timesketch_postgres_version: "15-alpine"
timesketch_redis_version: "7-alpine"

# Infrastructure Storage and Path Routing
timesketch_base_dir: "/opt/timesketch"
timesketch_config_dir: "{{ timesketch_base_dir }}/config"
timesketch_upload_dir: "{{ timesketch_base_dir }}/upload"
timesketch_postgres_data_dir: "{{ timesketch_base_dir }}/postgres_data"
timesketch_opensearch_data_dir: "{{ timesketch_base_dir }}/opensearch_data"

# Networking Configuration
timesketch_listen_port: 5000
timesketch_network_name: "timesketch_net"

# Application Security Credentials
timesketch_admin_user: "admin"
timesketch_admin_password: "SetSecurePasswordHere"
timesketch_db_user: "timesketch"
timesketch_db_password: "SetSecureDatabasePasswordHere"
timesketch_db_name: "timesketch"

# Resource and Engine Controls
timesketch_opensearch_jvm_opts: "-Xms2g -Xmx2g"
