---
- name: Create persistent storage base subdirectories
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ timesketch_directory.base | default('/opt/timesketch') }}"
    - "{{ timesketch_directory.upload | default('/opt/timesketch/upload') }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"
  become: true

- name: Create configuration subdirectory with container access permissions
  ansible.builtin.file:
    path: "{{ timesketch_directory.conf | default('/opt/timesketch/config') }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  become: true

- name: Render dynamic application configurations from template
  ansible.builtin.template:
    src: "timesketch.conf.j2"
    dest: "{{ timesketch_file.config | default('/opt/timesketch/config/timesketch.conf') }}"
    owner: "1000"
    group: "1000"
    mode: "0644"
  become: true

- name: Create persistent database directories with container access permissions
  ansible.builtin.file:
    path: "{{ db_directory }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0770"
  loop:
    - "{{ timesketch_directory.postgres_data | default('/opt/timesketch/postgres_data') }}"
    - "{{ timesketch_directory.opensearch_data | default('/opt/timesketch/opensearch_data') }}"
  loop_control:
    loop_var: db_directory
    label: "Provisioning database storage directory: {{ db_directory }}"
  become: true

- name: Deploy the Docker Compose template file
  ansible.builtin.template:
    src: "compose.yml.j2"
    dest: "{{ timesketch_file.compose | default('/opt/timesketch/compose.yml') }}"
    owner: root
    group: root
    mode: "0644"
  become: true
