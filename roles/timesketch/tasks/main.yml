---
- name: Ensure timesketch is installed and configured
  ansible.builtin.include_tasks:  state/install.yml
  when: timesketch_state | default('present') == 'present'

- name: Ensure timesketch is uninstalled from system
  ansible.builtin.include_tasks: state/uninstall.yml
  when: timesketch_state | default('present') == 'absent'

- name: Ensure timesketch is purged from system
  ansible.builtin.include_tasks: state/teardown.yml
  when: timesketch_state | default('present') == 'teardown'
