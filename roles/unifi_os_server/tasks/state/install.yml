---
- name: Create persistent storage base subdirectories
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ unifi_os_server_base_dir }}"
    - "{{ unifi_os_server_data_dir }}"
    - "{{ unifi_os_server_log_dir }}"
    - "{{ unifi_os_server_cert_dir }}"
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory }}"

- name: Deploy the Docker Compose template file
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ unifi_os_server_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Trigger container engine stack deployment
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    engine_project_src: "{{ unifi_os_server_base_dir }}"
    engine_platform_type: "{{ unifi_os_server_container_engine }}"
    engine_desired_state: "present"
    engine_trigger_condition: true
