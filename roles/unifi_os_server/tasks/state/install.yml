---
- name: Execute Unifi OS Server configuration tasks
  ansible.builtin.include_tasks: "configure/main.yml"

- name: Trigger container engine stack deployment
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    container_engine_project_src: "{{ unifi_os_server_base_dir | default('/opt/unifi-os') }}"
    container_engine_platform_type: "{{ unifi_os_server_container_engine }}"
    container_engine_desired_state: "present"
    container_engine_trigger_condition: true
