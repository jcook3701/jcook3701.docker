---
- name: Trigger container engine stack removal
  ansible.builtin.import_role:
    name: jcook3701.utils.container_engine
  vars:
    engine_project_src: "{{ unifi_os_server_base_dir }}"
    engine_platform_type: "{{ unifi_os_server_container_engine }}"
    engine_desired_state: "teardown"
    engine_trigger_condition: true
